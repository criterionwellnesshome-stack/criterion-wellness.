<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore practical health insights, wellness education and guidance to help you make more informed decisions about your health.">
    <title>Wellness Blog | The Criterion Holistic Wellness Home</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/style.css?v=12.0">
</head>
<body class="blog-landing-page">
    <!-- Injection point for Navigation -->
    <div id="nav-placeholder"></div>

    <main>
        <!-- Compact Blog Header & Controls -->
        <section class="blog-header-section">
            <div class="container">
                <div class="blog-header-inner">
                    <h1 class="blog-header-title">Knowledge for a healthier you.</h1>
                    <p class="blog-header-subtitle">Explore practical health insights, wellness education and guidance to help you make more informed decisions about your health.</p>

                    <div class="blog-controls-wrap">
                        <div class="blog-search-bar">
                            <svg class="blog-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="blogSearchInput" class="blog-search-input" placeholder="Search articles...">
                        </div>

                        <div class="blog-categories-pills" id="blogCategoriesPills">
                            <button class="category-pill active" data-category="">All Categories</button>
                            <!-- Dynamically populated from /api/blog/categories -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Articles Content Section -->
        <section class="blog-content-section">
            <div class="container">
                <!-- Featured Latest Article -->
                <div id="blogFeaturedArticle" class="blog-featured-wrap"></div>

                <!-- Remaining Articles 3-Column Grid -->
                <div id="blogGrid" class="blog-grid">
                    <div style="grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--color-text-muted);">
                        Loading wellness articles...
                    </div>
                </div>

                <!-- Pagination -->
                <div id="blogPagination" class="blog-pagination"></div>
            </div>
        </section>
    </main>

    <!-- Injection point for Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/components.js?v=5.0"></script>
    <script type="module" src="/js/blog.js?v=2.0"></script>
</body>
</html>
